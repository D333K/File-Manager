<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Simple File Explorer</title>
  </head>

  <body>
    <h1>File Explorer</h1>

    <div class="container">
      <div class="control-btns">
        <button class="new-folder-btn" title="Create Folder" disabled>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-folder-plus-icon lucide-folder-plus"
          >
            <path d="M12 10v6" />
            <path d="M9 13h6" />
            <path
              d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
            />
          </svg>
        </button>

        <button class="new-file-btn" title="Create File" disabled>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-file-plus-icon lucide-file-plus"
          >
            <path
              d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
            />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" />
            <path d="M9 15h6" />
            <path d="M12 18v-6" />
          </svg>
        </button>

        <button class="rename-btn" title="Rename" disabled>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-pencil-line-icon lucide-pencil-line"
          >
            <path d="M13 21h8" />
            <path d="m15 5 4 4" />
            <path
              d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
            />
          </svg>
        </button>

        <button class="delete-btn" title="Delete" disabled>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-trash2-icon lucide-trash-2"
          >
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>

        <button class="back-btn" title="Back" disabled>
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-big-left-icon lucide-arrow-big-left"
          >
            <path
              d="M10.793 19.793a.707.707 0 0 0 1.207-.5V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1h-6a1 1 0 0 1-1-1V4.707a.707.707 0 0 0-1.207-.5l-6.94 6.94a1.207 1.207 0 0 0 0 1.707z"
            />
          </svg>
        </button>
      </div>

      <div class="current-folder">current folder: <span id="path"></span></div>

      <div class="folder-content">
        <ul id="file-list">
          <li><button id="home-btn">home</button></li>
        </ul>
      </div>
    </div>

    <div class="create-container">
      <h3 id="create-title"></h3>
      <input id="input-name" type="text" value="" />

      <button id="create-btn">create</button>
      <button id="cancel-create-btn">cancel</button>
    </div>

    <div class="rename-container">
      <h3 id="rename-title">Rename</h3>

      <input id="input-name-f" type="text" value="" />

      <select id="select-f-rename"></select>

      <button id="rename-btn">rename</button>
      <button id="cancel-rename-btn">cancel</button>
    </div>

    <div class="delete-container">
      <h3 id="delete-title">Rename</h3>

      <select id="select-f-delete"></select>

      <button id="delete-btn">delete</button>
      <button id="cancel-delete-btn">cancel</button>
    </div>

    <script src="main.js"></script>
  </body>
</html>
